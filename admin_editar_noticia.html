{% extends "base.html" %}
{% block title %}Editar noticia{% endblock %}
{% block content %}

<a href="{{ url_for('admin_noticias') }}" class="back-link">← Gestión de noticias</a>
<h1 class="page-title">Editar noticia</h1>

<form method="POST" class="form-card" style="max-width:500px;">
    <label>Título</label>
    <input type="text" name="titulo" value="{{ noticia.titulo }}" required>
    <label>Descripción</label>
    <textarea name="descripcion" rows="5" required>{{ noticia.descripcion }}</textarea>
    <button type="submit" class="btn btn-primary btn-block">GUARDAR CAMBIOS</button>
</form>

{% endblock %}
